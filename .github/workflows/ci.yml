name: CI

# The feedback on PR and on push to a protected branch: the shared verification
# (`verify.yml` — build, typecheck, gates, unit suite), the two guards specific to this
# context (FEATURES.md drift).
#
# This repo no longer DEPLOYS anything: the API, the gateway, the console, the updates
# Worker and the relays have lived in the private `infra` repo since 31/08/2026, with their
# workflows (and the principle that chained them via `needs: [ci]`: nothing deploys without
# a green `verify`). What remains here is verification, and the desktop release on tag
# (`release.yml`, which keeps its own `verify`).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# ⚠️ `dorny/paths-filter` (the `changes` job) reads the list of modified files VIA THE
# GitHub API on a `pull_request` event — a local `git diff` isn't enough there. Without
# `pull-requests: read` it answers "Resource not accessible by integration" and the job
# fails in 20 s, taking down everything depending on it. This stayed invisible as long as these
# workflows only ran on PUSH (where paths-filter diffs locally): the
# FIRST pull request made them all fail at once.
# The rest is explicitly read-only — least privilege, and the repo's default
# no longer decides in our place.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path filter. It used to gate the backend e2e and the server deployments, which left
  # for the private `infra` repo on 31/08/2026; today it gates the corpus benches.
  # The `ci` job itself stays UNGATED (it IS the required status check -
  # path-skipping a required check would leave a PR forever "waiting").
  changes:
    runs-on: ubuntu-latest
    outputs:
      # No more server job here: the API, the gateway, the console, the Worker and the
      # relays have lived in the private `infra` repo since 31/08/2026, with their
      # workflows.
      packages: ${{ steps.f.outputs.packages }}
      corpus: ${{ steps.f.outputs.corpus }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR: dorny reads the file list VIA THE API (pull-requests: read), the
          # clone doesn't serve any further purpose — depth 1. Push: it diffs locally,
          # full history required.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: f
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'pnpm-lock.yaml'
            # The recall benches only move when the ENGINE moves — the same scope the
            # nightly pass in corpus.yml complements (a drift can also come from a
            # dependency bump, which the nightly net catches).
            corpus:
              - 'packages/redact/**'
              - 'packages/tesseract2/**'
              - 'packages/ort/**'
              - 'packages/catalog/**'
              - '.github/workflows/corpus.yml'

  # The verification itself. The job keeps the `ci` identifier: it's the context that
  # Terraform names in `github_required_status_checks` (the day an admin token
  # allows setting up branch protection, it will appear as `ci / verify`).
  # ⚠️ ALL deployments depend on it (`needs: [ci]`).
  # The check run that `main`'s protection REQUIRES — literal context "ci". A job that
  # calls a reusable workflow only publishes its CHILDREN ("ci / verify"), never
  # its own name: the staging → main promotion (PR #21) stayed BLOCKED with ALL
  # checks green, because no check was named "ci". This verdict job carries that
  # name and synthesizes: red if a required job failed or was cancelled; a SKIPPED job
  # (paths not touched) counts as good — it's the `changes` filter that decided that.
  verdict:
    name: ci
    if: always()
    needs: [changes, ci, features-drift]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "résultats: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Un job requis a échoué ou a été annulé."
            exit 1
          fi
          echo "ci ✓"

  ci:
    uses: ./.github/workflows/verify.yml
    secrets:
      POSTHOG_INGEST_KEY: ${{ secrets.POSTHOG_INGEST_KEY }}
      ANALYTICS_APP_KEY: ${{ secrets.ANALYTICS_APP_KEY }}

  # The corpus recall benches, when the diff touches the engine (see the `changes`
  # filter). ⚠️ Deliberately ABSENT from `verdict.needs`: the benches MEASURE, they
  # gate no deployment — the floors fail loudly on an engine regression, but a red
  # bench must never leave a docs-only PR (or a release) waiting on a recall number.
  # Same doctrine as the nightly pass in corpus.yml.
  corpus:
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    uses: ./.github/workflows/corpus.yml

  # FEATURES.md drift NUDGE (rule 13) — non-blocking on purpose, and specific to this
  # context: it diffs against a base that only the PR/push event supplies, which is
  # exactly why it doesn't join `verify.yml` (a tag deployment has no
  # base to diff against). It catches what the ratchet can't — a commit that changes a
  # feature-carrying UI without touching FEATURES.md in the same diff.
  features-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # NO install nor pnpm: the script only imports node:child_process and
      # only runs git. `cache: pnpm` without an install would even make the
      # cache save fail (the trap documented in audit.yml).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Master-file drift nudge
        env:
          FEATURES_DRIFT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/checks/check-features-drift.mjs



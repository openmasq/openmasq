name: Verify

# THE verification, in a single place — in TWO families since 13/08:
#
#   • `verify` (BLOCKING) — behavior: build, typecheck, tests, and the guards that
#     protect what RUNS (honest test harness, supply chain,
#     shipped bundles, effect returns). Red ⇒ no merge, no deployment.
#   • `hygiene` (NOT blocking, but VISIBLE) — debt ratchets: file
#     size, docs, duplication, master file, dead code. The job shows RED
#     when a debt grows — but it holds back neither a merge nor a deployment:
#     the 13/08 promotion was blocked FOUR times by hygiene while the
#     real bugs were elsewhere. Debt gets paid, it doesn't take hostages.
#
# Two families of callers, and that is this file's whole purpose:
#   • `ci.yml` — the feedback on PR and on push.
#   • EVERY deployment workflow, which puts it in `needs:` — it is THIS dependency that
#     prevents a deployment from going out without tests. `main`'s branch protection
#     ALSO exists (mandatory PR + "ci" check — ci.yml's verdict job carries that
#     name, a reusable-workflow caller only publishing its children); the
#     `needs:` remains what holds the DEPLOYMENTS, protection or not.
#
# ⚠️ Secrets are OPTIONAL and only serve `ci.yml`'s baked values. A
# caller that doesn't pass any gets a build with empty values — perfectly sufficient
# to typecheck and test, since this build PUBLISHES nothing. A gate that receives no
# secret cannot leak any: not passing `secrets: inherit` from a
# deployment would hand a verification job the repo's entire keyring.

on:
  workflow_call:
    secrets:
      POSTHOG_INGEST_KEY:
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Read-only, declared HERE because this workflow is called: the job otherwise inherits
    # the caller's permissions. Nothing here writes via GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: several gates diff against a base (FEATURES.md
          # drift on ci.yml's side), which a shallow checkout cannot resolve.
          fetch-depth: 0
          # The token doesn't stay in .git/config: everything that follows (installs, builds,
          # gates) runs the repo's code and needs NO git credential at all.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      # Turbo cache between runs. `pnpm build`/`typecheck` go through
      # scripts/tooling/turbo.mjs, whose default is this path; turbo's keys hash the
      # CONTENT (package + task + files + deps), never the path or the branch, so
      # any recently restored cache is valid — turbo only replays what has
      # changed. Measured cold: Build 278 s + Typecheck 181 s; a run that touches
      # only one package repays a fraction. Unique primary key (the SHA) so that each
      # run SAVES its state; restore-keys catches the most recent one.
      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/turbo/openmasq
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The domain has only ONE home (rule 9): the branding JSON. Resolved here rather
      # than copied as a literal into the build's env.
      - name: Resolve deploy origins (packages/branding/branding.json)
        id: origins
        run: |
          set -euo pipefail
          D=$(node -p "require('./packages/branding/branding.json').domain")
          HOST=$([ "${{ github.ref_name }}" = "main" ] && echo "app.$D" || echo "staging.$D")
          echo "backend=https://$HOST" >> "$GITHUB_OUTPUT"
          echo "admin=https://$HOST/admin" >> "$GITHUB_OUTPUT"

      # turbo build first: the workspace packages must emit their
      # dist/ (the apps consume that, not src). VITE_BACKEND_URL / VITE_ADMIN_URL set
      # the sync/org + admin origin in the built bundles: main →
      # production, any other ref → staging. Public config (like the Supabase URL),
      # so a var, not a secret. Left unset, the source falls back to production.
      - name: Build
        env:
          VITE_BACKEND_URL: ${{ steps.origins.outputs.backend }}
          VITE_ADMIN_URL: ${{ steps.origins.outputs.admin }}
          # Cloud redact-fn engine → the container SPECIFIC to the branch (one per env).
          # Var absent ⇒ empty ⇒ the remote engine stays off and the app falls back to the
          # local regex.
          VITE_REDACT_FN_URL: ${{ github.ref_name == 'main' && vars.SCW_REDACT_URL || vars.SCW_REDACT_URL_STAGING }}
          # Usage analytics: PostHog ingestion key baked into the
          # built bundles — DIRECT transport. Secret absent ⇒ empty ⇒ analytics does nothing
          # (it never launders anything). To switch to the compliant Scaleway
          # relay, set the ANALYTICS_RELAY_URL var: it wins over the key, and the
          # client no longer embeds any of it (no code change).
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_INGEST_KEY }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_ANALYTICS_RELAY_URL: ${{ vars.ANALYTICS_RELAY_URL }}
          # App-attestation HMAC key: the client signs each POST to the relay so it
          # can reject traffic that doesn't come from an official build (anti-abuse, not
          # identity). Empty value ⇒
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Lint (Biome), the whole tree: the classes of errors the typecheck cannot see —
      # a hook after a conditional return, a dead import, a cast optional chain. The
      # FORMAT is NOT checked here: a retroactive reformat would bloat
      # dense files past the hard 300-line cap (rule 1). Format is enforced on
      # STAGED code, in pre-commit — new/touched code conforms there, without rewriting existing code.
      - name: Lint (Biome)
        run: pnpm check:lint

      # A test file that no `include` matches is never run, and the suite
      # stays green — the one failure mode a warning cannot catch. This
      # gate requires every tracked *.test.ts(x) to be matched, or listed with its reason.
      - name: Test-include guard
        run: pnpm check:tests

      # Rule-9 parity: the package → source resolution table exists in the
      # vitest/electron-vite module AND in apps/desktop/tsconfig.json (JSON cannot import
      # TS). A drift resolves a package to src here, to dist there.
      - name: Workspace alias parity
        run: pnpm check:alias



      # Supply-chain guard, CI layer: every `uses:` must name a commit
      # SHA, not a tag. A tag is a mutable pointer its owner can
      # redirect to new code, which then runs here with the job's secrets
      # (signing certificates, store credentials, Vercel/Neon tokens). The
      # lockfile layer is minimumReleaseAge in pnpm-workspace.yaml; this is the same idea
      # one notch up.
      - name: Action-pin guard
        run: pnpm check:actions


      # Effect-return guard: a concise-arrow useEffect returns its expression
      # as its React cleanup function. The platform changes what the
      # DOM APIs return UNDER the types (Chromium made scrollIntoView return a Promise →
      # "destroy is not a function" → the whole app on the ErrorBoundary on every
      # model change), and the typecheck cannot see this class. Block
      # bodies and explicit returns only.
      - name: Effect-return guard
        run: pnpm check:effects

      # PII ratchet: REAL identities don't come back. The product is tested with
      # data that LOOKS LIKE PII — that's legitimate, and `__fixtures__/` carries the
      # made-up personas for that. What's forbidden is someone's REAL data. The gate
      # compares FINGERPRINTS: neither the script nor this log can restate the value they
      # protect. BLOCKING, and not in the "hygiene" job: the other ratchets describe
      # debt, this one describes a published personal data item — a red one
      # looked at later is already a leak.
      - name: PII ratchet
        run: pnpm check:pii

      # Retired names never come back — in the tree OR in a commit message. Blocking, for
      # the same reason as the PII ratchet: one occurrence published is already too many.
      - name: Retired-name guard
        run: pnpm check:brand

      # What ships to the user must not explain the code it contains: neither
      # a sourcemap (it renders the original TypeScript verbatim), nor a plain bundle. The
      # gate re-reads the BUILT artifacts, so it comes after `pnpm build` — and
      # the `:all` variant requires all three here, whereas locally (`pnpm check:shipped`, in
      # `verify`) an unbuilt target is simply skipped. Two scripts rather
      # than one flag: pnpm swallows flags it thinks are its own.
      - name: Shipped-bundle guard
        run: pnpm check:shipped:all

      # Unit tests (vitest). The desktop e2e drives the REAL OpenAI API (it costs
      # money) and is deliberately NOT run in CI.
      - name: Unit tests
        run: pnpm test

  # The DEBT RATCHETS — non-blocking, but not invisible: each guard runs
  # even if the previous one failed, and the whole job turns RED as soon as a debt
  # grows (continue-on-error at the JOB level: the caller stays green, the screen doesn't).
  # The underlying rule doesn't change — frozen debt can only shrink — the only thing that changes
  # is WHO waits: no one anymore. A red here gets fixed right away, not under the
  # threat of a held-back deployment.
  hygiene:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: File-size ratchet
        id: loc
        continue-on-error: true
        run: pnpm check:loc
      - name: Doc ratchet
        id: docs
        continue-on-error: true
        run: pnpm check:docs
      - name: Duplication ratchet
        id: dup
        continue-on-error: true
        run: pnpm check:dup
      - name: Master-file ratchet
        id: features
        continue-on-error: true
        run: pnpm check:features
      - name: Dead-code ratchet
        id: knip
        continue-on-error: true
        run: pnpm check:knip
      # i18n ratchet: hard-coded French copy only goes down. Here (non-blocking,
      # visible) because it's translation DEBT, not a fix-me red —
      # like its siblings above.
      - name: i18n ratchet
        id: i18n
        continue-on-error: true
        run: pnpm check:i18n
      # The verdict: a single failure is enough to paint the job red (without blocking
      # the caller). The list says WHICH ONES, to fix without rereading five logs.
      - name: Verdict hygiène
        run: |
          set -euo pipefail
          failed=""
          [ "${{ steps.loc.outcome }}" = "failure" ] && failed="$failed check:loc"
          [ "${{ steps.docs.outcome }}" = "failure" ] && failed="$failed check:docs"
          [ "${{ steps.dup.outcome }}" = "failure" ] && failed="$failed check:dup"
          [ "${{ steps.features.outcome }}" = "failure" ] && failed="$failed check:features"
          [ "${{ steps.knip.outcome }}" = "failure" ] && failed="$failed check:knip"
          [ "${{ steps.i18n.outcome }}" = "failure" ] && failed="$failed check:i18n"
          if [ -n "$failed" ]; then
            echo "::warning::Dette d'hygiène en hausse (non bloquant) :$failed — à corriger dans la foulée."
            exit 1
          fi
          echo "hygiène ✓"

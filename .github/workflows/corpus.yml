name: Corpus

# Les bancs de RAPPEL du redaction (`pnpm test:corpus`) — ils MESURENT, ils ne gardent
# aucun déploiement. Sortis de `ci.yml` le 14/08 pour une raison de coût mesurée : ils
# tournaient sur CHAQUE push et CHAQUE PR (une centaine de fois par mois, ~4 min chacune,
# build complet compris) alors qu'ils ne bougent que si le moteur bouge.
#
# Deux appelants, un seul corps (règle 9) :
#   • `ci.yml` — quand le diff touche le moteur (`packages/redact`, l'OCR, l'ONNX) ;
#   • la NUIT — parce qu'un banc qui ne tourne que sur le chemin qui le concerne finit
#     par ne plus tourner du tout : une dérive de rappel peut aussi venir d'un lexique
#     vendu ailleurs, d'un bump de dépendance ou d'une fixture. Le filet nocturne coûte
#     quatre minutes et rattrape ce que le filtre de chemins ne peut pas voir.
#
# ⚠️ Le build RESTE une précondition — vitest résout les `src` des packages aliasés, mais
# `@openmasq/tesseract2` (vendored) se résout par son dist/, et `scans.recall` l'importe :
# sans build, « Failed to resolve entry for package tesseract2 ». Avec le cache turbo, ce
# build coûte des secondes, pas 5 min.
on:
  workflow_call:
  # ⚠️ Un `schedule` ne part que depuis la branche par DÉFAUT (main) : la passe nocturne
  # mesure donc la production, ce qui est exactement ce qu'on veut d'un filet.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Une seule passe à la fois par ref : deux bancs concurrents mesurent la même chose et
# se disputent le cache turbo.
concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      # ⚠️ La MÊME clé que `verify.yml` (plus de suffixe `-corpus`) : le build est
      # identique, et deux caches distincts faisaient payer DEUX fois le même build à
      # chaque commit. Les clés de turbo hachent le contenu, donc partager le magasin est
      # sans risque — au pire une entrée de plus.
      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/turbo/openmasq
          key: turbo-${{ runner.os }}-${{ github.sha }}-corpus
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Corpus benches
        run: pnpm test:corpus

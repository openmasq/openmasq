name: Corpus

# The RECALL benches for redaction (`pnpm test:corpus`) — they MEASURE, they don't guard
# any deployment. Taken out of `ci.yml` on 14/08 for a measured cost reason: they
# ran on EVERY push and EVERY PR (about a hundred times a month, ~4 min each,
# full build included) even though they only move when the engine moves.
#
# Two callers, one body (rule 9):
#   • `ci.yml` — when the diff touches the engine (`packages/redact`, OCR, ONNX);
#   • at NIGHT — because a bench that only runs on the path it concerns ends up
#     not running at all: a recall drift can also come from a lexicon
#     shipped elsewhere, a dependency bump or a fixture. The nightly net costs
#     four minutes and catches what the path filter can't see.
#
# ⚠️ The build REMAINS a precondition — vitest resolves the aliased packages' `src`, but
# `@openmasq/tesseract2` (vendored) resolves via its dist/, and `scans.recall` imports it:
# without a build, « Failed to resolve entry for package tesseract2 ». With the turbo cache, this
# build costs seconds, not 5 min.
on:
  workflow_call:
  # ⚠️ A `schedule` only fires from the DEFAULT branch, which is `dev` here — so the
  # nightly pass measures the trunk, not what is in the field. That is the right net for
  # now (a recall drift is caught where it lands); the day `main` becomes the released
  # commit and the default branch, this comment and that intent both need re-reading.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only one pass at a time per ref: two concurrent benches measure the same thing and
# fight over the turbo cache.
concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      # ⚠️ The SAME key as `verify.yml` (no more `-corpus` suffix): the build is
      # identical, and two separate caches were making the same build get paid for TWICE
      # per commit. Turbo's keys hash the content, so sharing the store is
      # risk-free — at worst one more entry.
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/turbo/openmasq
          key: turbo-${{ runner.os }}-${{ github.sha }}-corpus
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Corpus benches
        run: pnpm test:corpus

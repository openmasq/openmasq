name: Windows (essai à blanc)

# DRY RUN of the Windows target — builds, LAUNCHES the app, and stops there.
#
# This workflow publishes NOTHING: no R2, no registration with the updates Worker,
# no channel touched. Since `release.yml` builds Windows in its matrix, only
# one reason remains to keep it, and it's a good one: it launches ON DEMAND on
# ANY commit (tag `win-*`, see `on:`), with no secret at all, whereas the release
# only exists on `dev` and `v*` tags. This is the preflight run BEFORE merging.
#
# What it answers, and that nothing else can answer from a mac:
#   • MAX_PATH (260): electron-builder copies the Python runtime (tens of thousands
#     of plotly files) and `asarUnpack: **/node_modules/**` — it's the Windows equivalent
#     of the EMFILE we had to fix on the macOS side;
#   • does the jail launcher (`native/win-jail`) compile, and does it REALLY confine (`prove-jail.sh`);
#   • does the binary START? (`e2e:boot` + `e2e:models`, release.yml's two smokes);
#   • how much the installer weighs.
#
# ⚠️ A question it no longer asks: "do the wheels exist in `win_amd64`?". The
# bake now knows how to build a runtime for a machine other than its own, so this
# risk is also visible from a mac or linux runner (`crossInstall.ts`).
#
# 💸 Cost: `windows-latest` is billed ×2 (versus ×10 for `macos-latest`), so a run
# costs about a tenth of a mac build. It's still REQUESTED — see the gate.
#
# ⚠️ NO SECRET is passed to this workflow, and it must never receive one: it
# triggers from any commit on a simple tag pushed by hand. The
# baked values are therefore public literals, and the update channel points at a name that
# DOES NOT EXIST (`desktop-winci`) — even launched, this app cannot see a real channel.

on:
  # Usable once this file is on `main` (GitHub only exposes a workflow_dispatch from
  # the default branch).
  workflow_dispatch: {}
  # Until then — and from any commit, without going through `staging`: a `win-*` TAG.
  #
  # ⚠️ This used to be `branches: ["**"]` + the `[desktop-win]` marker in the commit message,
  # read by a job `if:`. The marker cost no minutes when absent,
  # BUT GitHub still registers a run (`skipped`) for EVERY push on EVERY branch:
  # 50 empty lines out of the last 300 runs, enough to drown out the real reds. A
  # tag filter, on the other hand, creates no run as long as nothing is requested — same explicit gesture, zero
  # noise, and it works from any commit (a protected branch is not
  # required, unlike the `workflow_dispatch` button):
  #
  #     git tag -f win-essai && git push -f origin win-essai
  #
  # (The `-f` re-triggers: GitHub emits a push for a tag UPDATE just like for a
  # creation. `win-*` never crosses `release.yml`'s `v*` tags, which do publish.)
  #
  # ⛔ PAUSED (14/08/2026), at the same time as `release.yml`'s Windows leg: as long as
  # the Windows app isn't ready, no Windows runner gets paid for — neither to publish, nor
  # to try. The tag trigger is therefore REMOVED, not the file: this preflight remains
  # the only thing that answers MAX_PATH, the sandbox compiling, and the binary
  # starting up, and it's the one we'll rerun first upon waking. To turn it back on,
  # uncomment the two lines below.
  #
  # push:
  #   tags: ["win-*"]

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # No "gate" job like in release.yml, and no `if:` either: the
    # trigger IS the gate. Every run that arrives here was requested — button, or
    # `win-*` tag pushed by hand.
    runs-on: windows-latest
    timeout-minutes: 90
    # All steps in bash (git-bash is present on Windows runners): the same
    # script as on the macOS side, rather than a pwsh translation that would drift silently.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BEFORE the install: npm/pnpm already write deep paths. The MAX_PATH cap
      # (260 characters) is THE Windows packaging trap — `asarUnpack: **/node_modules/**`
      # plus the Python runtime's site-packages go well beyond it. We lift both
      # locks: the kernel's (registry) and git's.
      - name: Enable long paths (Windows MAX_PATH)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true
          Write-Host "LongPathsEnabled=1, git core.longpaths=true"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The brand (domain, slug) is read from packages/branding/branding.json (rule 9),
      # never as a literal in a step.
      - name: Resolve branding (packages/branding/branding.json)
        id: brand
        run: |
          set -euo pipefail
          B=./packages/branding/branding.json
          {
            echo "slug=$(node -p "require('$B').slug")"
            echo "domain=$(node -p "require('$B').domain")"
          } >> "$GITHUB_OUTPUT"

      # Same belt as release.yml: pnpm 10 blocks postinstalls, so Electron's
      # binary isn't downloaded on install and the FIRST `require("electron")`
      # (e2e:boot's `_electron.launch`) would trigger a download RIGHT IN THE MIDDLE OF A TEST.
      - name: Ensure Electron binary
        run: test -f node_modules/electron/path.txt || node node_modules/electron/install.js

      # The bundle, with PUBLIC values only (see the banner: this workflow doesn't
      # receive any secret). The baked channel doesn't exist on the Worker's side, on purpose.
      - run: pnpm exec turbo run build --filter=@openmasq/desktop...
        env:
          VITE_BACKEND_URL: https://staging.${{ steps.brand.outputs.domain }}
          VITE_ADMIN_URL: https://staging.${{ steps.brand.outputs.domain }}/admin
          VITE_UPDATES_CHANNEL: desktop-winci

      # release.yml's two smokes. They launch the `out/` bundle (not the installer),
      # which is enough to see the class of bugs that kills the app at launch: an optional peer
      # turned throw, a missing native module, an IPC handler that throws at registration.
      # This is the first time this code starts up on Windows.
      - name: Boot smoke (launch the built app once)
        working-directory: apps/desktop
        run: pnpm run e2e:boot

      - name: Model-switch smoke
        working-directory: apps/desktop
        run: pnpm run e2e:models

      # `runner.os` is in the key, so this cache is distinct from the macOS job's.
      - name: Cache baked Python runtime + NER models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/desktop/build/python-runtime
            apps/desktop/build/ner-models
          key: bake-${{ runner.os }}-${{ hashFiles('apps/desktop/src/main/python/wheels.ts', 'apps/desktop/src/main/python/runtimeSpec.ts', 'apps/desktop/scripts/bake-ner-models.ts', 'apps/desktop/src/main/ner/model.ts') }}

      # THE #1 question of this run: win32-x64 CPython is already pinned
      # (`runtimeSpec.ts`), but `pip install --only-binary=:all:` requires a
      # `win_amd64` wheel for EVERY entry in `wheels.ts`. A single missing one fails here.
      - name: Bake bundled runtime + NER models + the jail launcher
        working-directory: apps/desktop
        run: pnpm bake

      # THE proof of the sandbox, and the only one that counts: compiling the jail launcher says
      # nothing about what it confines. So we launch the REAL launcher around the REAL interpreter
      # and have it attempt two reads.
      #
      # Both count. Without the POSITIVE control, a launcher that crashes at startup —
      # or an AppContainer that doesn't even see python.exe — would make the
      # control read "fail" and would read as a success. It's the most likely failure mode
      # of a first attempt, and it's exactly the one a naive test rewards.
      - name: Prove the jail actually jails (AppContainer read-deny)
        working-directory: apps/desktop
        run: bash scripts/prove-jail.sh

      # FULL packaging (NSIS installer + blockmap + latest.yml), not `--dir`: it's
      # the installer creation that exercises MAX_PATH and the artifact name. `--publish
      # never` as a safety net, on top of the fact that no credential is present.
      # The version carries `-winci.<run>`: never confusable with a real build, and never
      # colliding with release.yml's `-staging.<run>` numbering.
      - name: Package (unsigned — essai à blanc)
        id: pack
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          VERSION="${PKG}-winci.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          pnpm run eb --publish never -c.extraMetadata.version="$VERSION"

      # The last guard that sees a node_modules tree FLATTENED by electron-builder (the
      # 0.3.2 failure, green everywhere else). `--require-tree` because it only knew
      # the macOS layout: without it, an unrecognized layout reads as "nothing to
      # check" and turns green for the wrong reasons.
      - name: Verify packaged dependency tree
        run: pnpm check:pkgtree --require-tree

      # THE check that was missing, and whose absence cost a dead install for
      # a user: the C++ runtime DLLs must be NEXT TO the exe, not just
      # baked. Without them, `@libsql` doesn't load on a machine without the "Visual C++
      # Redistributable" and the app dies at launch — that's what happened.
      #
      # We check them here rather than at bake time because it's PACKAGING that can
      # lose them: a misplaced `extraFiles`, too broad a filter, a drifting `to:`. A
      # green bake and an empty app is exactly the failure we want to make impossible.
      - name: Verify the C++ runtime shipped NEXT TO the exe
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          missing=0
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
            if [ -f "release/win-unpacked/$dll" ]; then
              printf '  ✓ %-22s %s\n' "$dll" "$(du -h "release/win-unpacked/$dll" | cut -f1)"
            else
              echo "::error::$dll MISSING from release/win-unpacked — the app will not start on a machine without the redistributable"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      # The number that will settle the "embed the Python runtime or not" tradeoff: it
      # weighs ~500 MB for a feature `sandbox.ts` refuses to run here.
      - name: Report artifact sizes
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          {
            echo "### Essai Windows — ${{ steps.pack.outputs.version }}"
            echo
            echo '| artefact | taille |'
            echo '|---|---|'
            for f in release/*.exe release/*.blockmap release/*.yml; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "Runtime Python embarqué : $(du -sh build/python-runtime/win32-x64 2>/dev/null | cut -f1 || echo 'absent')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat release/latest.yml || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.brand.outputs.slug }}-windows-${{ steps.pack.outputs.version }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          # Short: these artifacts run into hundreds of MB and only serve to
          # install the trial by hand once.
          retention-days: 3
          if-no-files-found: error

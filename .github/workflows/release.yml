name: Release

# SINGLE ARTIFACT: the trigger decides the STORAGE (which channel these bytes are published on)
# and the NUMBER — no URL at all anymore. The addresses live in the binary's baked table
# (`apps/desktop/src/environments/`), resolved at runtime: production by default,
# staging via the privileged toggle. A candidate is therefore the REAL software ahead of time,
# pointed at production — and the beta→stable promotion happens without a rebuild, via the
# Worker (`POST /admin/desktop/releases/promote`): same bytes, same number.
#
# ⚠️ The BAKED channel (VITE_UPDATES_CHANNEL) is `desktop-stable` for ANY build published by
# tag, and it does not say where the bytes are published: it is the DEFAULT of the first launch
# (`main/updates/config.ts`). Since promotion copies the bytes, a literal `desktop-beta`
# traveled with them: a fresh install of the landing's "stable" .dmg would follow the beta
# silently (observed on 14/08 — the entire fleet a candidate in spite of itself). Beta is an
# EXPLICIT act: machine privilege `allow_self_pin` + in-app toggle — never a baked default.
# Only the MANUAL launch (never promoted, disposable) keeps `desktop-beta`: an install from an
# internal trial MUST follow the beta.
#
#   trigger                    STORAGE             BAKED CHANNEL   VERSION
#   push -> tag staging-v*     desktop-staging     desktop-stable  <tag>  (staging-v0.5.1 -> 0.5.1)
#   push -> tag v*             desktop-production  desktop-stable  <tag>  (v0.5.1 -> 0.5.1, depuis main)
#
# ⚠️ A TAG, NEVER A BRANCH. No branch push builds the app — neither `dev`,
# nor `main`. This is the rule set on 11/08 for ALL app deployments (desktop and
# mobile): a release is a dated and named ACT, not the side effect of a push.
#
# ⚠️ The `v*` tag remains useful WITHOUT being the normal path: the nominal route to stable is
# the PROMOTION of an already-proven candidate, not a rebuild. A direct `v*` tag = a
# fresh build that never went through beta — reserved for an emergency fix, said explicitly.
# A privileged device (allow_self_pin, ops console) sees both channels via the Worker's
# /desktop/all-releases; the ENVIRONMENT itself is toggled inside the app (env:switch).
#
# 💸 THIS WORKFLOW IS THE REPO'S BIGGEST EXPENSE. `macos-latest` is billed ×10 and the
# job runs 22–24 min, i.e. ~230 minute-equivalents per build — on a free quota of
# 2,000/month (PRIVATE repo, personal account). The trigger used to be `packages/**`, i.e.
# almost every push: the morning of 30/07 burned ~730 min-eq in successive builds, of which
# three were cancelled (a cancelled run is billed for the time already consumed). A desktop build
# is now REQUESTED, it is no longer triggered by a touched path — and since
# 11/08 the request IS the tag: the `branches: [dev]` trigger + the
# `[desktop]` marker in the commit message have been dropped. The marker cost almost nothing in
# minutes (the ubuntu `gate` only ran once the run was registered) but it registered a
# run per push on `dev` — 34 out of the last 300 — and above all it made a
# RELEASE be decided by a commit message, where a tag is explicit and reviewable.
on:
  push:
    tags:
      # Production (tags cut from `main`). ⚠️ `v*` cannot catch `staging-v…`:
      # the glob is anchored at the start of the tag name. The two channels therefore cannot
      # be confused, and that is the property that matters here.
      - "v*"
      # Staging. The branch name no longer enters the equation: a
      # `staging-v*` can be placed on any commit to try.
      - "staging-v*"
  # Manual launch — always builds, and ALWAYS in `staging` (see the `meta` job:
  # only a `v*` tag gives production, everything else falls back to staging, fail closed).
  # NOTE: GitHub only exposes a workflow_dispatch from the DEFAULT branch, so this
  # becomes usable once this file is on `main`; until then, the tag is the way.
  workflow_dispatch: {}

# An in-flight STAGING build is replaced by the next one: without this, two
# `staging-v*` tags placed ten minutes apart would run TWO macOS runners (×10)
# on the same channel, and the second one would win anyway. Hence a single group shared
# by all staging tags — the predecessor gets cancelled, as the old push used to do
# on the branch. A `v*` tag (production), on the other hand, has its OWN group and is NEVER cancelled
# mid-flight: a signature/notarization/publish is never cut in two.
# ⚠️ The `refs/tags/v` predicate must stay the SAME as the one in the `meta` job (the env is decided
# there): letting them diverge means cancelling a production or piling up stagings.
# Least privilege for `GITHUB_TOKEN`: without this block, a workflow inherits the repo's
# DEFAULT — which nothing here sets and which can be write-enabled. This job installs then runs
# ~2,000 packages on a machine holding the Apple credentials and the R2 keys; a
# hostile postinstall doesn't also need a token capable of pushing to the repo.
# `contents: read` is enough for `actions/checkout`, and publishing goes through its OWN
# secrets, never through this token.
permissions:
  contents: read

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'staging' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # ⛔ There is no longer a `gate` job. It used to read the `[desktop]` marker from the commit message
  # to decide whether a push on `dev` deserved a macOS runner; the trigger now only
  # knows tags, so ANY run that arrives here was explicitly requested and
  # has nothing left to re-decide. Do not reintroduce it to "filter": a path filter
  # is wrong in both directions (`packages/**` catches almost everything, `apps/desktop/**` misses
  # a regression in `packages/redact` that nonetheless changes the app), and that is exactly why
  # we moved to a written intent. The tag IS that intent.

  # The barrier that was missing: nothing goes off to be signed and notarized unless the
  # suite is green. It runs on ubuntu (~5 min) BEFORE the macOS runner (×10)
  # starts — so a red tag never touches a runner billed at ten times the rate.
  # No secret is passed: `verify.yml` explains why.
  verify:
    uses: ./.github/workflows/verify.yml

  # The env, the channel, the baked URLs and the VERSION — computed ONCE, here, and consumed
  # by the matrix as well as by the closing jobs. Before the matrix this computation lived in the
  # release job and a single copy was enough; with two platforms plus a purge plus an
  # email, leaving it there would mean writing it four times (rule 9). And this is THE value
  # that must be identical everywhere: two legs each computing their own version would be
  # exactly the misalignment the matrix exists to prevent.
  meta:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.m.outputs.env }}
      channel: ${{ steps.m.outputs.channel }}
      # ⚠️ TWO names per channel, and it is a contract with the Worker (`lib/desktopChannels.ts`):
      # `channel` is the PUBLIC name baked into the app (desktop-beta / desktop-stable),
      # `storage_channel` the HISTORICAL identity of R2 and the database (desktop-staging /
      # desktop-production) — renaming the storage would have orphaned every existing install.
      # CI publishes and prunes under the storage name; the Worker aliases the requests.
      # A divergence is LOUD: the first candidate build would get a 404 feed.
      storage_channel: ${{ steps.m.outputs.storage_channel }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Decide env / channel / baked URLs / version from the trigger (see header).
      # ⚠️ ONLY a `v*` tag gives production — the `else` catches EVERYTHING else
      # (`staging-v*`, a manual launch from any ref) and falls back to
      # staging. This is the CLOSED failure: an unexpected ref delivers, at worst, to a test channel,
      # never to users. Never invert this test into "if staging then staging".
      # ⚠️ THE VERSION COMES FROM THE TAG, not from package.json — this is the contract of the
      # rebuild-free promotion: a `staging-v0.5.1` candidate is called `0.5.1`, and it is THESE bytes,
      # under THIS number, that will be promoted onto the stable channel (the Worker `/promote`). A
      # suffixed number (`0.5.1-staging.42`) would not be promotable: electron-updater
      # identifies a release by version + sha512, and the same bytes cannot
      # carry two numbers. Accepted consequence: a NEW candidate = a NEW number
      # (staging-v0.5.2) — two tags on the same number, and the second does not propagate.
      # A MANUAL launch (no tag) keeps the old suffixed scheme: a disposable trial,
      # never promotable, and that is exactly right.
      - name: Compute env / channel / version
        id: m
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "env=production"
              echo "channel=desktop-stable"
              echo "storage_channel=desktop-production"
              echo "version=${GITHUB_REF#refs/tags/v}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/staging-v* ]]; then
            {
              echo "env=staging"
              # `desktop-stable` ON PURPOSE (see the header): these bytes will be promoted as
              # they are, and the baked channel is the default for a NEW install — not the
              # storage they go to (`storage_channel` below says that instead).
              echo "channel=desktop-stable"
              echo "storage_channel=desktop-staging"
              echo "version=${GITHUB_REF#refs/tags/staging-v}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "env=staging"
              echo "channel=desktop-beta"
              echo "storage_channel=desktop-staging"
              echo "version=${PKG}-staging.${GITHUB_RUN_NUMBER}"
            } >> "$GITHUB_OUTPUT"
          fi

  release:
    # No more condition: the trigger has already decided (a tag, or a manual request).
    # And still no `always()`, on purpose — `verify` MUST have succeeded, so a skip or
    # a failure of the verification blocks the release, production tag included.
    needs: [verify, meta]
    # ONE release, TWO platforms — and the reason is the VERSION. It equals
    # `<pkg>-staging.<GITHUB_RUN_NUMBER>`: two separate workflows are two run
    # numbers, so two different versions for the SAME code. The Worker would support it
    # (since migration 0007 each platform has its own row and version), but the download
    # page would show macOS at `.124` and Windows at `.127`, and a rollback would have to
    # target two distinct versions. A matrix shares the run number: one version, two
    # consistent rows.
    #
    # `fail-fast: false`: a platform that breaks must not cancel the other. The result
    # is then a version published for a single platform — which the per-platform schema
    # handles natively, and which is better than losing both.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ NO arch list here, on purpose: the mac leg builds TWO (see
          # `mac.target` in electron-builder.yml), but it is THAT file that decides it and
          # only that file. The list is QUERIED further down (`print-shipped-triples`) — copied here,
          # it would diverge at the first arch addition, and the divergence would not show up at
          # build time: it would show up on the machine left without its interpreter.
          - os: macos-latest
            platform: mac
          # ⛔ WINDOWS PAUSED (14/08/2026) — as long as the Windows app isn't ready, we don't
          # pay for its build. A `windows-latest` runner is billed ×2 and the leg runs
          # ~25 min, i.e. ~50 min-eq per release, for a binary nobody installs
          # yet. The CODE stays intact (electron-builder `win:`, the sandbox, the
          # runtime triples): only the matrix line is dropped.
          #
          # TO TURN IT BACK ON: uncomment the two lines below, and nothing else.
          #   - os: windows-latest
          #     platform: win
          #
          # ⚠️ What awaits it upon waking, already fixed so it doesn't fall again: the
          # Windows git-bash does NOT have `shasum` (the Python runtime upload step
          # died there on 0.7.0) — the checksum is now computed with whichever of the two
          # tools exists. And the `release-windows.yml` preflight answers the questions
          # no mac can settle (MAX_PATH, the sandbox, the binary starting up):
          # rerun it BEFORE putting this line back.
    runs-on: ${{ matrix.os }}
    # Backstop: a hung build (a stuck notarization / frozen electron-builder) is KILLED at
    # 120 min instead of burning to GitHub's 6 h default - so a wedged run always stops.
    # ⚠️ 90 → 120 when moving the mac leg to TWO arches: it notarizes twice, and Apple's
    # queue isn't ours to control. The guard rail must cover a slow notary without
    # covering a stuck build — not the other way around, or it cuts off legitimate releases.
    timeout-minutes: 120
    # All steps in bash: git-bash is present on Windows runners, so the
    # SAME script runs on both sides rather than a pwsh translation that would drift.
    defaults:
      run:
        shell: bash
    # ⚠️ `secrets` is FORBIDDEN in an `if:` — neither for a job nor a step. GitHub does not
    # report it at run time: it refuses to LOAD the workflow, and the run shows up as failed
    # WITH ZERO JOBS (run 31484319877 — mac included, even though only the Windows condition
    # was at fault). The secret therefore travels via the job's env, which `if:` can read; and it
    # is populated only on the Windows leg, just as the Apple credentials are populated only on
    # the mac leg.
    env:
      WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
      # Same mechanism for the sourcemaps upload: `if:` cannot read `secrets`
      # (the workflow does not LOAD), the job's env can. Empty ⇒ the step is skipped.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # The other credentials travel as DECISIONS, not as values: a job-level env is visible
      # to every step, `pnpm install`'s ~2,000 packages included, and the R2 keys or the
      # Apple certificate have no business there. Each step that needs the value reads
      # `secrets.*` in its OWN env; the `if:` reads the flag. Empty ⇒ the step is SKIPPED
      # with a named notice, never a raw auth error forty minutes in. This is what lets a
      # fork with NO secret configured run a tag build to the end: it gets the unsigned
      # artifact on the run (`PUBLISH` below decides), nothing reaches a channel.
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && '1' || '' }}
      HAS_APPLE: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && '1' || '' }}
      # ⛔ THE SIGNATURE BARRIER, decided ONCE: a build goes on a channel only if it is signed
      # for its platform AND the publish credentials exist. Unsigned mac, unsigned Windows,
      # no updates token, no R2: the build is kept on the run instead (see the two steps at
      # the end of the job). Never publish on one condition and upload-to-run on another —
      # the two steps must be exact complements, and this flag is the one home of that.
      PUBLISH: ${{ secrets.UPDATES_ADMIN_TOKEN != '' && secrets.R2_ACCESS_KEY_ID != '' && ((matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '') || (matrix.platform == 'win' && secrets.WIN_CSC_LINK != '')) && '1' || '' }}
      # The Cloudflare account behind the R2 bucket — ONE home in this file (rule 9), a
      # fork points it at its own account through the repository variable.
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || '39336bdea04ecbc7b2a906744205245b' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # BRAND values (R2 bucket, model org, updates domain) have
      # only ONE home: packages/branding/branding.json (rule 9). Resolved here for the whole
      # job — never copied as a literal in a step.
      - name: Resolve branding (packages/branding/branding.json)
        id: brand
        run: |
          set -euo pipefail
          B=./packages/branding/branding.json
          {
            echo "slug=$(node -p "require('$B').slug")"
            echo "domain=$(node -p "require('$B').domain")"
            echo "hforg=$(node -p "require('$B').hfOrg")"
          } >> "$GITHUB_OUTPUT"

      # BEFORE the install: the MAX_PATH cap (260 characters) is THE Windows packaging
      # trap — `asarUnpack: **/node_modules/**` plus the Python runtime's site-packages
      # go well beyond it. We lift the kernel lock and git's.
      - name: Enable long paths (Windows MAX_PATH)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      # pnpm version comes from the root package.json `packageManager` field -
      # don't also set `version:` here (action-setup@v4 errors on a duplicate).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⚠️ Electron has NO install script (`scripts` absent from its package.json):
      # its binary is NEVER downloaded on install, and the first `require("electron")`
      # — here e2e:boot's `_electron.launch` — triggers a synchronous 295 MB download
      # RIGHT IN THE MIDDLE OF A TEST: stdout inherited in the Playwright worker's pipes, run stuck on
      # "Downloading Electron binary..." (run 30538725006, killed by hand). On 12/08 the
      # UNIT suite worked around it differently (`scripts/vitest/vitest.electron-stub.ts`).
      # ⚠️ No pnpm config covers this case, contrary to what this block used to say:
      # `onlyBuiltDependencies` only allows a script, and there isn't one — a fresh dev
      # machine doesn't have the binary either. THIS step is the only safety net, and it is
      # deliberately deterministic: pnpm's rebuild of an already-materialized tree refuses to
      # rerun the build, whereas install.js directly is idempotent (no-op if the binary is there).
      - name: Ensure Electron binary
        run: test -f node_modules/electron/path.txt || node node_modules/electron/install.js

      # Build ONLY the desktop bundle + its workspace deps (turbo `--filter`), NOT the
      # whole monorepo - a desktop release needs neither apps/web nor the other apps,
      # and building them here both wasted minutes AND coupled the release to unrelated
      # build failures (an apps/web type error used to fail the desktop release). `...`
      # pulls in @openmasq/desktop's dependency graph (ui/llm/redact/...) -> their dist/.
      # Only the CHANNEL is baked into the bundle: VITE_UPDATES_CHANNEL is the DEFAULT of a
      # fresh install (`desktop-stable` for any published build — see the header; a
      # machine already on beta keeps its `updates.json`) — the origins, on the other hand, come
      # from the binary's table, at runtime.
      - run: pnpm exec turbo run build --filter=@openmasq/desktop...
        env:
          # Service addresses arrive HERE, at build time, and nowhere in the repo
          # (`src/environments/index.ts`: no committed default — a fork that doesn't supply
          # any builds an app that runs on the machine). The artifact stays SINGLE:
          # production AND staging are baked together into the binary's table, and it is the
          # privileged toggle that chooses at runtime — never a build per environment.
          #
          # ⚠️ `OPENMASQ_BILLING` is THE gate (`scripts/buildDefines.ts` `serviceDefines`):
          # without `"1"`, the API and the gateway are baked EMPTY even if supplied — the
          # public build then has no API accounts, no sync, no organizations, no models
          # included, and sells nothing. All that remains is Supabase authentication, the
          # Slack relay, analytics and the updates feed, each on its own variable. It is
          # a repo variable (`vars`), not a literal: opening or closing it does not
          # require a commit.
          OPENMASQ_BILLING: ${{ vars.OPENMASQ_BILLING }}
          OPENMASQ_BACKEND_URL: ${{ vars.OPENMASQ_BACKEND_URL }}
          OPENMASQ_BACKEND_URL_STAGING: ${{ vars.OPENMASQ_BACKEND_URL_STAGING }}
          OPENMASQ_GATEWAY_URL: ${{ vars.OPENMASQ_GATEWAY_URL }}
          OPENMASQ_GATEWAY_URL_STAGING: ${{ vars.OPENMASQ_GATEWAY_URL_STAGING }}
          # Outside the gate — reachable in any official build: the Supabase
          # project (client credentials, public by nature), the Slack relay (`apps/auth`, in the
          # private `infra` repo), the Sentry DSN and the connectors' OAuth credentials
          # (each one is the identifier of a specific provider account: env, never committed).
          OPENMASQ_SUPABASE_URL: ${{ vars.OPENMASQ_SUPABASE_URL }}
          OPENMASQ_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OPENMASQ_SUPABASE_PUBLISHABLE_KEY }}
          OPENMASQ_AUTH_URL: ${{ vars.OPENMASQ_AUTH_URL }}
          OPENMASQ_SENTRY_DSN: ${{ vars.OPENMASQ_SENTRY_DSN }}
          OPENMASQ_GITHUB_CLIENT_ID: ${{ vars.OPENMASQ_GITHUB_CLIENT_ID }}
          OPENMASQ_SLACK_CLIENT_ID: ${{ vars.OPENMASQ_SLACK_CLIENT_ID }}
          OPENMASQ_GOOGLE_CLIENT_ID: ${{ vars.OPENMASQ_GOOGLE_CLIENT_ID }}
          OPENMASQ_GOOGLE_CLIENT_SECRET: ${{ secrets.OPENMASQ_GOOGLE_CLIENT_SECRET }}
          OPENMASQ_MICROSOFT_CLIENT_ID: ${{ vars.OPENMASQ_MICROSOFT_CLIENT_ID }}
          # The updates feed (Worker `apps/updates`) — the same address the
          # publish steps push to, further down (`UPDATES_URL`). Empty ⇒ no
          # auto-update nor Versions screen (`appEnv.ts` UPDATES_CONFIGURED).
          VITE_UPDATES_URL: ${{ vars.UPDATES_URL || format('https://updates.{0}', steps.brand.outputs.domain) }}
          # The CHANNEL, on the other hand, is the default of the first launch (which BUILDS a
          # fresh install will receive), not which API is being talked to — and its absence means "build
          # local" for analytics, a signal we don't want to lose.
          VITE_UPDATES_CHANNEL: ${{ needs.meta.outputs.channel }}
          # ⚠️ THE SAME version as `-c.extraMetadata.version` further down, and that is the
          # whole point: this bundle is built BEFORE electron-builder stamps the
          # version, so without this line the renderer falls back to the repo's
          # `package.json` (`0.4.1`) while the installed app is called `0.4.1-staging.123`.
          # Two consequences measured on 11/08: PostHog's `app_version` would not budge
          # from one update to the next (every build of the same x.y.z lumped together,
          # adoption unmeasurable), and Sentry received TWO releases for a single app —
          # main reads `app.getVersion()` (suffixed), the renderer reads this define. Pinned
          # by `apps/desktop/src/sentry/policy.test.ts`.
          VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
          # Analytics + error tracking go through the FIRST-PARTY relay (apps/analytics-fn)
          # which holds the PostHog key server-side - so NO key is ever baked into the
          # shipped desktop app. Deliberately no VITE_POSTHOG_KEY here (main.tsx is
          # relay-only). Env-independent single relay; empty => analytics stays a no-op.
          VITE_ANALYTICS_RELAY_URL: ${{ vars.ANALYTICS_RELAY_URL }}
          # App-attestation HMAC key: the client signs each relay POST with it so the
          # relay can reject traffic that is not from an official build (anti-abuse,
          # non-identity). Empty
          # value => no attestation header (a relay with ANALYTICS_APP_KEYS set 401s).
          VITE_ANALYTICS_APP_KEY: ${{ secrets.ANALYTICS_APP_KEY }}
          # (NO Vercel bypass: the single artifact would ship it to everyone — the
          # `assertNoBakedBypass` guard in electron.vite.config.ts fails any CI build
          # that carries one.)

      # SOURCEMAPS → Sentry. The bundles are minified and their maps produced in
      # `hidden` mode (never referenced, excluded from the app by electron-builder — the guard:
      # scripts/checks/check-shipped-bundles.mjs). Without this upload, every frame kept by
      # sentry/policy.ts resolves to `index.js:1:184232` and grouping breaks on every
      # release (observability audit 13/08). Step SKIPPED without the secret: a release
      # must never fail over symbolication.
      - name: Upload sourcemaps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: apps/desktop
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          # `app:///` is the prefix normalizePathsIntegration gives to frames.
          pnpm dlx @sentry/cli@2 sourcemaps upload \
            --release "${{ needs.meta.outputs.version }}" \
            --url-prefix "app:///out" \
            out

      # BOOT SMOKE - launch the freshly built app once BEFORE spending sign/notarize
      # minutes on it. The build alone cannot prove the app loads: a bundled optional
      # peer becomes an unconditional throw (the linkedom/canvas class - statically
      # gated by apps/desktop/scripts/check-bundle.mjs inside `build`), a native module
      # missing from the packaged tree, an IPC handler throwing at registration - all
      # of these PASS the build and kill the app at launch. One real launch (window +
      # DOM, no model, no network) is the only test that sees the whole class.
      - name: Boot smoke (launch the built app once)
        working-directory: apps/desktop
        run: pnpm run e2e:boot

      # MODEL-SWITCH smoke: the most-used gesture after "send", and the one a platform
      # shift broke silently (Chromium made scrollIntoView return a Promise; a concise
      # effect returned it as React's cleanup -> "destroy is not a function" -> the
      # whole app on the ErrorBoundary). Typecheck can't see it (lib.dom still says
      # void) and the boot smoke doesn't navigate - only a real walk of the finder does.
      # No model called, no network needed.
      - name: Model-switch smoke
        working-directory: apps/desktop
        run: pnpm run e2e:models

      # Bake the BUNDLED, pruned Python runtime (sha256-pinned CPython + wheels) and the
      # local BERT NER models into apps/desktop/build/ - electron-builder ships them via
      # extraResources so the app needs ZERO network fetch on first use. Cached on the
      # runtime signature (CPython+wheels) + NER model set, so a re-run skips the download.
      - name: Cache baked Python runtime + NER models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/python-runtime
            apps/desktop/build/ner-models
            apps/desktop/build/embed-models
          # `electron-builder.yml` goes into the key: it is the one that decides HOW MANY arches
          # get baked. Without this, a single-arch cache would get reused under a name that
          # promises two — and the missing bake would only show up at packaging time.
          key: bake-${{ runner.os }}-${{ hashFiles('apps/desktop/electron-builder.yml', 'apps/desktop/src/main/python/wheels.ts', 'apps/desktop/src/main/python/runtimeSpec.ts', 'apps/desktop/scripts/bake-ner-models.ts', 'apps/desktop/src/main/ner/model.ts', 'apps/desktop/scripts/bake-embed-models.ts', 'apps/desktop/src/main/embed/model.ts') }}

      # The Memory's IN-HOUSE e5 export (first-party re-export of intfloat/
      # multilingual-e5-small, sha256-pinned — NO public upstream serves these bytes,
      # see bake-embed-models.ts). CI pulls it from OUR R2; the bake re-verifies every
      # byte against EMBED_WEIGHTS_SHA256, so integrity comes from the pin, not the host.
      # FAILURE = RED BUILD, on purpose: the bake's fail-soft skip shipped EVERY
      # version since July without semantic Memory, without anyone noticing —
      # in CI, shipping without the embedder becomes a decision again, not an accident.
      # WITHOUT R2 credentials (a fork), the step is skipped and the next one SAYS what
      # the build will lack — a warning on the run, not a silent absence.
      - name: Fetch the vendored e5 embedder export (our R2)
        if: ${{ env.HAS_R2 == '1' }}
        shell: bash
        env:
          R2_BUCKET: ${{ steps.brand.outputs.slug }}-updates
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/e5-src"
          aws s3 cp --recursive --no-progress \
            "s3://$R2_BUCKET/bake/embed-models/${{ steps.brand.outputs.hforg }}/multilingual-e5-small" "$DEST" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com"
          test -f "$DEST/onnx/model_quantized.onnx"
          echo "OPENMASQ_E5_SRC=$DEST" >> "$GITHUB_ENV"
      - name: No R2 credentials — the embedder is not fetched
        if: ${{ env.HAS_R2 != '1' }}
        run: echo "::warning::R2_ACCESS_KEY_ID is not configured — the e5 embedder is not fetched, and \`pnpm bake\` will skip it (bake-embed-models.ts). This build ships WITHOUT semantic Memory."
      - name: Bake bundled runtime + NER models (+ the jail launcher on Windows)
        working-directory: apps/desktop
        # `pnpm bake` bakes EVERY arch this platform ships (`bake-runtimes.ts`
        # reads `electron-builder.yml`), so what CI does is exactly what
        # `pnpm run release` does on a machine. No loop here: it would recreate the list.
        run: pnpm bake

      # THE proof of the Windows sandbox, and the only one that counts: compiling
      # the jail launcher (`native/win-jail`) says nothing about what it confines. So we launch the REAL launcher
      # around the REAL interpreter and have it attempt two reads — one against its
      # granted scratch, which must SUCCEED, and one against a control target outside the grants, which must
      # FAIL. Without the positive control, a launcher that crashes at startup would make
      # the control read "fail" and would read as a success.
      #
      # This is a RELEASE GUARD, not a comfort test: without it, a regression of the
      # confinement would ship signed and notarized to users.
      - name: Prove the jail actually jails (AppContainer read-deny)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: bash scripts/prove-jail.sh

      # Decoupled Python engine - PHASE 1 (additive, non-breaking). Upload the freshly
      # baked runtime as a CONTENT-ADDRESSED archive to R2 (`runtime/<name>`, served by
      # the updates Worker's GET /runtime/:file) so a FUTURE app version can download it
      # ONCE - keyed by its runtime signature - instead of re-shipping ~500 MB in every
      # update. The app is STILL bundled here (the un-bundle flip is a follow-up), so
      # this cannot break a running app. Idempotent: skips when this signature's archive
      # already exists on R2 (the name changes only when the runtime spec changes).
      - name: Upload baked Python runtime archive to R2 (decoupled engine)
        if: ${{ env.HAS_R2 == '1' }}
        working-directory: apps/desktop
        env:
          R2_BUCKET: ${{ steps.brand.outputs.slug }}-updates
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli >= 2.23 adds a default integrity checksum (CRC64NVME) to every
          # upload; Cloudflare R2 rejects it on multipart CreateMultipartUpload, which
          # surfaces as "SignatureDoesNotMatch". GitHub runners auto-update the CLI, so
          # a >5 MB upload that worked months ago now fails with no code change. Restore
          # the old behaviour (checksum only when the operation requires one).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        # One archive PER TRIPLE — the mac leg produces two. ⚠️ `continue`, never `exit 0`:
        # exiting on the first triple already present on R2 would skip the SECOND, which
        # might be missing. It is the loop that makes the resumption correct, not the head-object.
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com"
          for TRIPLE in $(pnpm exec tsx scripts/print-shipped-triples.ts ${{ matrix.platform }}); do
            NAME=$(pnpm exec tsx scripts/print-runtime-archive.ts "$TRIPLE")
            SRC=build/python-runtime/$TRIPLE
            [ -d "$SRC/python" ] || { echo "no baked runtime at $SRC - skip"; continue; }
            if aws s3api head-object --bucket "$R2_BUCKET" --key "runtime/$NAME" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
              echo "runtime/$NAME already on R2 - nothing to do"; continue
            fi
            echo "Packing $SRC -> $NAME"
            tar -C "$SRC" -czf "/tmp/$NAME" .
            # ⚠️ `shasum` (a Perl script) is present on macOS and Linux images, NOT
            # in Windows runners' git-bash — hence "shasum: command not found"
            # and the win leg failing AFTER packing the archive (0.7.0, 14/08). The reverse
            # is true too: macOS doesn't have `sha256sum`. We use whichever exists.
            if command -v sha256sum >/dev/null 2>&1; then
              SHA=$(sha256sum "/tmp/$NAME" | awk '{print $1}')
            else
              SHA=$(shasum -a 256 "/tmp/$NAME" | awk '{print $1}')
            fi
            printf '%s' "$SHA" > "/tmp/$NAME.sha256"
            echo "sha256=$SHA size=$(wc -c < /tmp/$NAME) bytes"
            aws s3 cp "/tmp/$NAME" "s3://$R2_BUCKET/runtime/$NAME" --endpoint-url "$ENDPOINT"
            aws s3 cp "/tmp/$NAME.sha256" "s3://$R2_BUCKET/runtime/$NAME.sha256" --endpoint-url "$ENDPOINT" --content-type "text/plain"
            echo "uploaded runtime/$NAME (+ .sha256)"
          done

      # Package, sign and notarize the desktop app (no publish - we upload to R2).
      # extraMetadata.version stamps the exact version (staging gets the unique
      # -staging.<run> prerelease without mutating package.json in git); it flows
      # into the .dmg/.zip filenames + each latest*.yml the publish step registers.
      - name: Build desktop app
        working-directory: apps/desktop
        # electron-builder copies + signs the bundled python-runtime (tens of
        # thousands of small plotly validator files) and blows past the macOS runner's
        # low default open-file limit (256) -> "EMFILE: too many open files".
        # - ï¸ A bare `ulimit -n` is NOT enough: on macOS `ulimit -Hn` is "unlimited"
        # (which `ulimit -n` REJECTS), and a fallback ABOVE `kern.maxfilesperproc`
        # silently no-ops (`|| true`) -> the limit stayed at 256 and EMFILE returned.
        # So RAISE THE KERNEL PER-PROCESS CAP first (sudo sysctl), THEN the soft limit
        # to a concrete value the kernel now permits, and LOG what actually took.
        # `run eb` (not `exec electron-builder`): the Electron runtime version is COMPUTED
        # from the resolved `electron` dependency inside that script. electron-builder.yml
        # deliberately pins nothing - a literal there drifts silently, and shipped 31.7.7
        # against an installed 39.x for who knows how long.
        # The EMFILE preamble is specific to macOS (`sudo sysctl` doesn't exist elsewhere), so
        # it is conditioned rather than removed: the mac path stays line for line what
        # it was. On Windows the equivalent cap is MAX_PATH, already lifted above.
        # ⚠️ Without the Apple credentials (`HAS_APPLE` empty — a fork, or a rotated
        # secret) the mac leg takes the Windows-style path: `pnpm run eb`, NO identity
        # lookup, NO notarization. `mac-release.ts` would otherwise stop before packaging
        # (it requires the credentials up front, on purpose). The result is an UNSIGNED
        # app that installs with a Gatekeeper warning — kept on the run, never published.
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            sudo sysctl -w kern.maxfiles=1048576 kern.maxfilesperproc=1048576 >/dev/null 2>&1 || true
            ulimit -n 262144 2>/dev/null || ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
            echo "effective open-file limit (ulimit -n): $(ulimit -n)"
            # ⚠️ NOT `pnpm run eb` here, and it's a question of COST. electron-builder
            # processes arches end-to-end one after another, so it was waiting on Apple
            # TWICE in series on a runner billed ×10 — even though this wait is pure
            # network. `mac-release.ts` only moves that: the two submissions wait
            # TOGETHER, the signing stays sequential. It too goes through `pnpm run eb`
            # for each packaging step, so `eb.mjs`'s guards are intact, and it prints
            # the time actually spent at Apple's (that measurement will tell what it's worth).
            if [ "$HAS_APPLE" = "1" ]; then
              pnpm exec tsx scripts/mac-release.ts "${{ needs.meta.outputs.version }}"
            else
              echo "::warning::MAC_CSC_LINK / APPLE_ID are not configured — packaging an UNSIGNED, non-notarized mac build."
              CSC_IDENTITY_AUTO_DISCOVERY=false pnpm run eb --publish never -c.mac.notarize=false -c.extraMetadata.version=${{ needs.meta.outputs.version }}
            fi
          else
            pnpm run eb --publish never -c.extraMetadata.version=${{ needs.meta.outputs.version }}
          fi
        env:
          # ⚠️ The Apple credentials are passed ONLY on the mac leg. `CSC_LINK` isn't
          # a macOS-specific name: on a Windows runner, electron-builder would read a
          # WINDOWS certificate there and try to sign with a Developer ID .p12. Hence the
          # condition on each value rather than a shared block.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          # Windows: nothing here for now. Authenticode signing (Azure Artifact
          # Signing) will plug in via `win.sign` in electron-builder.yml + the three
          # AZURE_* variables, the day the certificate profile exists. As long as they
          # are absent, the .exe ships UNSIGNED — it installs, with a SmartScreen screen.

      # The LAST gate that can still see this class of bug, and the only one: the
      # node_modules electron-builder just wrote is a FLATTENED copy of the workspace root
      # (one version per package NAME), so a dep pinned to a non-hoisted version silently
      # gets the wrong one. Nothing before packaging resolves that tree - 0.3.2 shipped with
      # `entities@4.5.0` under `htmlparser2@10`, threw ERR_PACKAGE_PATH_NOT_EXPORTED at
      # module load, and was DEAD ON LAUNCH with every other gate green. Runs BEFORE publish
      # so such a build is never registered with the updates Worker.
      # `--require-tree`: the guard SKIPS (green) when it doesn't find a packaged app,
      # which is fine off the build path — but here we JUST built one, so
      # "nothing to check" can only mean one thing: it no longer recognizes the
      # layout. That is exactly how it used to see nothing of a Windows build.
      - name: Verify packaged dependency tree
        run: pnpm check:pkgtree --require-tree

      # ⛔ THE SIGNATURE BARRIER — an UNSIGNED artifact does not go out on a channel.
      #
      # On mac, Developer ID signing + notarization are the integrity anchor that
      # Squirrel.Mac verifies BEFORE swapping the app: a compromise of R2 or the Worker
      # isn't enough to get a binary installed. On Windows, as long as no
      # Authenticode certificate exists, this anchor is ABSENT — `NsisUpdater.verifySignature()`
      # returns `null` for lack of a `publisherName` in `app-update.yml`, so the update
      # verifies NOTHING and all trust falls back onto TLS + the CI secrets.
      #
      # Publishing anyway would amount to shipping, to users, executable code
      # whose only guarantee is "the bucket hasn't been compromised". So: the
      # Windows leg publishes ONLY if the certificate is configured. The day `WIN_CSC_LINK`
      # exists, publishing turns itself on — without this guard, it's the opposite that
      # would have happened silently.
      - name: Publish desktop release (R2 + register with updates Worker)
        if: ${{ env.PUBLISH == '1' }}
        run: bash apps/desktop/scripts/publish-desktop.sh --release-dir apps/desktop/release --channel ${{ needs.meta.outputs.storage_channel }}
        env:
          UPDATES_URL: ${{ vars.UPDATES_URL || format('https://updates.{0}', steps.brand.outputs.domain) }}
          UPDATES_ADMIN_TOKEN: ${{ secrets.UPDATES_ADMIN_TOKEN }}
          R2_BUCKET: ${{ steps.brand.outputs.slug }}-updates
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # publish-desktop.sh uploads the .dmg/.zip via `aws s3 cp` (multipart on large
          # artifacts) — same R2 checksum incompatibility as the runtime step above.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # The exact complement of the guard above: a build that is NOT published EXISTS (it
      # was built, launched, verified), it simply doesn't go on a channel. It stays
      # retrievable on the run for a manual install — that's what `release-windows.yml`
      # used to do, and what a fork without signing secrets gets from a tag.
      - name: Upload the unpublished build to the run (not to a channel)
        if: ${{ env.PUBLISH != '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.brand.outputs.slug }}-${{ matrix.platform }}-unpublished-${{ needs.meta.outputs.version }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          retention-days: 7
          if-no-files-found: error

  # BOTH PLATFORMS ARE PUBLISHED — what follows happens ONCE, not per leg.
  #
  # In the matrix, the purge would run twice in parallel on the same channel (two
  # concurrent R2 deletions targeting the same objects), and the email draft would be
  # created twice at Resend. Neither is simple waste: these are
  # two external side effects, not idempotent with each other.
  #
  # `needs: release` waits for the WHOLE matrix. With `fail-fast: false`, a failing
  # platform fails this job — so no purge until publishing is not
  # complete: old versions aren't deleted while the new one is only half
  # there. That's the right direction for retention.
  finalize:
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same logic as in the release job: the brand (domain) is read from
      # packages/branding/branding.json, never as a literal.
      - name: Resolve branding (packages/branding/branding.json)
        id: brand
        run: echo "domain=$(node -p "require('./packages/branding/branding.json').domain")" >> "$GITHUB_OUTPUT"

      # STAGING only: prune old desktop builds. desktop-beta gets one build per
      # CI run, so without this its R2 artifacts (~hundreds of MB each) accumulate
      # forever. Keep the newest 4 releases (plus any build behind an active
      # rollout rule) and delete the rest - the Worker removes BOTH the R2 objects
      # and the DB rows in one authenticated call (it owns both bindings, so CI
      # needs only the admin token, no R2 S3 creds). Production is never
      # auto-pruned (its rare builds are rollback targets). Housekeeping only -
      # a prune failure warns but never fails the release (publish already ran).
      - name: Prune old desktop staging builds (keep newest 4)
        if: ${{ needs.meta.outputs.env == 'staging' }}
        env:
          UPDATES_URL: ${{ vars.UPDATES_URL || format('https://updates.{0}', steps.brand.outputs.domain) }}
          UPDATES_ADMIN_TOKEN: ${{ secrets.UPDATES_ADMIN_TOKEN }}
          CHANNEL: ${{ needs.meta.outputs.storage_channel }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/desktop-prune.out -w '%{http_code}' \
            -X POST "$UPDATES_URL/admin/desktop/releases/prune?channel=$CHANNEL&keep=4" \
            -H "Authorization: Bearer $UPDATES_ADMIN_TOKEN" || true)
          echo "prune HTTP $code"; cat /tmp/desktop-prune.out || true; echo
          if [ "$code" != "200" ]; then echo "::warning::desktop prune failed (HTTP $code) - skipping"; fi

      # The release-notes e-mail is NOT prepared here any more: `@openmasq/emails` left with
      # the server side (the private `infra` repository, 2026-08-31) and so did the
      # workflow that drafts and sends it (`release-notes-email.yml`, there). This
      # repository publishes the BUILD; announcing it is the operator's step, over there.

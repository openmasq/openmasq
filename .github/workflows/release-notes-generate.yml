name: Release notes — generate (AI → Contentful)

# ACTION 1: turn the last N commits into a user-facing release note with Claude,
# and create it (published) in Contentful. Manual dispatch — the operator picks the
# commit window and version. Pairs with release-notes-email.yml (ACTION 2), which
# emails the latest published note.
#
# Secrets: MISTRAL_API_KEY, CONTENTFUL_CMA_TOKEN (both NEW — add via Terraform
# `github` module or `gh secret set`). Vars: CONTENTFUL_SPACE (+ optional
# CONTENTFUL_ENVIRONMENT / CONTENTFUL_CONTENT_TYPE / MISTRAL_MODEL). Missing any
# required one ⇒ the script no-ops (prints what it would do), never a hard fail.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.4.0). Empty = read apps/desktop/package.json."
        required: false
        default: ""
      commits:
        description: "How many recent commits to summarise."
        required: false
        default: "20"

# Moindre privilège (cf. release.yml) : checkout seul.
permissions:
  contents: read

concurrency:
  group: release-notes-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CONTENTFUL_SPACE: ${{ vars.CONTENTFUL_SPACE }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
      CONTENTFUL_CONTENT_TYPE: ${{ vars.CONTENTFUL_CONTENT_TYPE }}
      CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
    steps:
      # Full history so `git log -n <commits>` has the commits to summarise.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate + publish release note
        run: |
          pnpm --filter @openmasq/emails release:generate -- \
            --version "${{ github.event.inputs.version }}" \
            --commits "${{ github.event.inputs.commits }}"

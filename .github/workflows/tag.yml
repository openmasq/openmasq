name: Tag

# A release is a dated and named ACT (the rule of 11/08), and the act belongs in CI — not in
# whoever's shell happened to be open. `release.yml` already builds and signs here; this is
# the missing half, the TAG that starts it, with the checks that used to live in a human's
# memory made mechanical.
#
# ⚠️ THE TOKEN IS THE WHOLE DIFFICULTY. A tag pushed with the default `GITHUB_TOKEN`
# deliberately triggers NO further workflow — `release.yml` would never fire and the tag
# would sit there building nothing, which looks exactly like a release that worked. So this
# job needs a token that is not the default one: a fine-grained PAT with `contents: write`
# on this repository, stored as the `RELEASE_TAG_TOKEN` secret. Without it the job REFUSES
# to tag rather than push a tag that builds nothing.
#
#   channel   tag        storage         what it is
#   beta      beta-v*    desktop-beta    the candidate; promoted to stable without a rebuild
#   stable    v*         desktop-stable  the EMERGENCY rebuild, from `main`, never the normal path
#
# The normal route to stable is the PROMOTION of a proven candidate (the Worker's
# `/admin/desktop/releases/promote`), never a second build of the same software.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. 0.10.1) — must equal apps/desktop/package.json"
        required: true
        type: string
      channel:
        description: "beta = candidate · stable = emergency rebuild from main"
        required: true
        type: choice
        options: [beta, stable]
        default: beta
      ref:
        description: "Commit or branch to tag (default: the ref this run was started from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: A token that can actually start a build
        env:
          TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN is not set. A tag pushed with GITHUB_TOKEN starts no"
            echo "::error::workflow, so release.yml would never build. Add a fine-grained PAT"
            echo "::error::(contents: write on this repository) as the RELEASE_TAG_TOKEN secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: The number, the note and the tag agree
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *[!0-9.]*|""|.*|*.) echo "::error::'$VERSION' is not a bare version like 0.10.1"; exit 1;;
          esac
          # The app's package.json is the single source of the product version: release.yml,
          # the note parser and the Worker all read that number. A tag that disagrees means
          # two versions for one set of bytes, counted twice by Sentry and PostHog.
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::apps/desktop/package.json says $PKG, you asked to tag $VERSION."
            echo "::error::Bump and push the release commit first."
            exit 1
          fi
          # No section, no e-mail and an empty Contentful entry — and no error anywhere,
          # which is why it is checked here instead of being noticed by a reader.
          if ! grep -qE "^## $VERSION — [0-9]{4}-[0-9]{2}-[0-9]{2}$" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md has no '## $VERSION — YYYY-MM-DD' section."
            exit 1
          fi
          TAG=$([ "$CHANNEL" = "stable" ] && echo "v$VERSION" || echo "beta-v$VERSION")
          # A number is a set of bytes, once: electron-updater identifies a release by
          # version + sha512, so a second tag of the same number never reaches anyone.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. A failed candidate gets the NEXT number."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: A stable tag comes from main
        if: ${{ inputs.channel == 'stable' }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::A v* tag is the EMERGENCY rebuild and is cut from main. This commit"
            echo "::error::is not on main. The normal route to stable is promotion, not a rebuild."
            exit 1
          }

      - name: CI is green on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # The checks that ran on THIS commit, not "on the branch lately": a green tip and a
          # green commit are different facts when two pushes land close together.
          CONCLUSIONS=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name | test("^(CI|scan)")) | "\(.name)=\(.conclusion // "pending")"')
          echo "$CONCLUSIONS"
          if [ -z "$CONCLUSIONS" ]; then
            echo "::error::No CI check run found for $SHA. Push the release commit and let CI finish."
            exit 1
          fi
          if echo "$CONCLUSIONS" | grep -qv "=success$"; then
            echo "::error::CI is not green on $SHA. A tag builds, signs and publishes — it does"
            echo "::error::not get to start from a red commit."
            exit 1
          fi

      - name: Tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "### Tagged \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`release.yml\` takes it from here: build, start test, sign, notarise, publish." >> "$GITHUB_STEP_SUMMARY"

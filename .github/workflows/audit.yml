name: audit

# Dependency-audit GATE. Runs `pnpm audit` and fails ONLY on high/critical
# advisories that reach a SHIPPED or internet-facing surface (see
# scripts/checks/audit-gate.mjs — SERVED_WORKSPACES + the dev-tool denylist). Dev/build/
# test tooling (electron-builder, vitest, wrangler, vite, react-email's Next, …)
# is reported but never fails the build, so the signal isn't drowned by noise.
#
# ⚠️ NOT a required status check yet. Today it is RED on real existing debt
# (Electron 43 · xlsx vendored at 0.20.3 under vendor/ · Hono 4.9 on apps/updates · path-to-regexp ReDoS).
# It's informational until that debt is cleared; once it goes green, add `audit`
# to the branch-protection required checks (Terraform-managed
# required_status_checks, outside this repo) to make it blocking.
on:
  # NEITHER on push NOR on pull_request: this gate deploys nothing, isn't a required check,
  # and it's RED on known debt (see above) — a run per PR was therefore adding
  # 25 failures out of 300 runs that taught nobody anything and drowned the real reds.
  # Security advisories are TIME-BASED anyway (a CVE arrives with no code
  # change): the weekly cron tracks the debt better than a run per commit, and the workflow
  # stays launchable by hand before a dependency change.
  # ⚠️ The day it turns green and becomes a required check (branch protection,
  # on the Terraform side), PUT BACK `pull_request: branches: [main, dev]` on it — a
  # required check that never triggers blocks every PR.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Read-only: the gate reads the lockfile and the npm registry, it writes nothing via
# GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No `cache: pnpm` here on purpose: this job never runs `pnpm install`, so
      # the pnpm store dir never exists and setup-node's post-run cache-save step
      # fails the job with "Path Validation Error … do(es) not exist". The gate
      # only reads the lockfile + registry, so there's nothing to cache anyway.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # `pnpm audit` resolves from the lockfile + the registry; no install/build
      # needed, so this stays fast and independent of the main `ci` job.
      - name: Dependency audit gate
        run: node scripts/checks/audit-gate.mjs

name: audit

# Dependency-audit GATE. Runs `pnpm audit` and fails ONLY on high/critical advisories that
# reach a SHIPPED surface (scripts/checks/audit-gate.mjs). Dev/build/test tooling is
# reported but never fails the build.
#
# ⚠️ NOT a required status check yet: it is RED on known, existing debt. Informational until
# that debt is cleared; once green, add `audit` to the branch-protection required checks.
on:
  # NEITHER on push NOR on pull_request: this gate is not a required check and is red on
  # known debt, so a run per PR would only drown the real reds. Advisories are TIME-BASED
  # anyway: a weekly cron tracks the debt better than a run per commit. ⚠️ The day it becomes
  # a required check, PUT BACK `pull_request: branches: [main, dev]` — a required check that
  # never triggers blocks every PR.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Read-only: the gate reads the lockfile and the npm registry, it writes nothing via
# GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm` here on purpose: this job never runs `pnpm install`, so
      # the pnpm store dir never exists and setup-node's post-run cache-save step
      # fails the job with "Path Validation Error … do(es) not exist". The gate
      # only reads the lockfile + registry, so there's nothing to cache anyway.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # `pnpm audit` resolves from the lockfile + the registry; no install/build
      # needed, so this stays fast and independent of the main `ci` job.
      - name: Dependency audit gate
        run: node scripts/checks/audit-gate.mjs

name: scan

# STATIC analysis of the repo itself — what neither tests nor typecheck see:
# a committed secret, and a class of vulnerability in the code.
#
# Separate from `verify.yml` ON PURPOSE. `verify` answers "does this change break
# something?" and must stay fast, because every PR waits on it. These two analyses
# answer "does the repo carry something that shouldn't be there?" — a
# largely TIME-BASED question (a detection rule improves without the code
# moving) and much slower. Hence: the secrets gate on every PR and every push
# (fast, and a secret must never get through a PR), CodeQL weekly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # lundi 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secrets ────────────────────────────────────────────────────────────────────
  # `.gitleaks.toml` existed with its carefully written allow-list and its line "a
  # hit OUTSIDE these paths is a real finding" — but NOTHING ran gitleaks. The
  # configuration of a scanner that isn't run gives the impression of a guard rail that
  # doesn't exist; this job makes it real.
  #
  # ⚠️ The allow-list isn't laxity: the product IS a redaction engine, so its
  # fixtures necessarily contain strings SHAPED like a secret (`sk-live-DEADBEEF…`,
  # `AKIA…`, JWTs). They are confined to the paths `.gitleaks.toml` enumerates.
  #
  # ⚠️ OFFICIAL binary pinned by sha256, not a third-party action — for two reasons.
  # First, rule 7: nothing runs here without a verified fingerprint, and the origin is
  # the author's (`gitleaks/gitleaks` releases), never a repackaging. Second,
  # `gitleaks/gitleaks-action` requires a license for ORGANIZATIONS: a job that answers
  # 402 six months later is a guard rail that turns itself off.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: on a single-commit repo this is cheap, and the day
          # the history grows longer the scan must cover all of it — a secret removed
          # from the tree stays readable in the commit that introduced it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks version

      # `detect` reads the HISTORY (every commit), `--redact` prevents the found value
      # from landing in a public log: we want to know WHERE, never WHAT.
      - name: Scan history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  # ── Code ───────────────────────────────────────────────────────────────────────
  # CodeQL on TypeScript. What it catches that the typecheck doesn't see: source→sink
  # flows (untrusted input reaching an `exec`, a path, a query).
  # The repo has few of these by construction — the boundaries are guarded by hand and
  # documented — but "few" is verified, not declared.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publier les alertes dans l'onglet Security
      # ⚠️ `actions: read` isn't decorative: the `analyze` action queries
      # `GET /repos/{o}/{r}/actions/runs/{id}` to attach the SARIF to the right run. Without it
      # it fails with "Resource not accessible by integration" AFTER analyzing everything
      # — ten minutes of compute thrown away at the last step, and a message that doesn't name
      # the missing permission. Required on a PRIVATE repo; harmless once public.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          queries: security-extended
      # No build: the JS/TS extractor reads the sources as-is. A `pnpm install`
      # here would only add minutes and third-party code to analyze.
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

# The nightly MONEY PATH — scripts/money-path-probe.mjs against STAGING.
#
# What the canary (canary.yml) doesn't cover: the canary probes surfaces WITHOUT
# auth; this one runs the full authenticated path — real Supabase
# login, subscription, credits, and change-tier to the CURRENT tier (which crosses
# auth + database + Stripe READ then comes back `changed:false` without modifying anything:
# the exact path of the 502 that stayed invisible for two days on 07/08).
#
# Nightly rather than the canary's cadence: the path consumes a real login and touches
# Stripe (read-only) — once a night is enough to bound an incident's
# window to ~24 h instead of "whenever someone stumbles onto it".
#
# OPERATOR prerequisites (the two secrets, not derivable by Terraform):
#   MONEY_PATH_EMAIL / MONEY_PATH_PASSWORD — a dedicated probe account on the
#   project's Supabase, ideally carrying a TEST Stripe subscription (staging
#   runs in test mode) so the change-tier step is actually exercised.
#   Without a subscription, the probe passes but SHOUTS it as a warning on every run.
name: Money path (staging)

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: money-path
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26 }
      - name: Conduire le parcours
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_PUBLIC_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          DOMAIN: ${{ vars.STAGING_WEB_DOMAIN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EMAIL: ${{ secrets.MONEY_PATH_EMAIL }}
          PASSWORD: ${{ secrets.MONEY_PATH_PASSWORD }}
        run: node scripts/money-path-probe.mjs

version: 2

# Dependency updates proposed as PRs. The role is to make the debt VISIBLE
# and dated; what decides whether to block or not remains `scripts/audit-gate.mjs`, which sorts by
# SURFACE (shipped/served vs tooling) rather than by raw severity.
#
# ⚠️ This does NOT bypass `minimumReleaseAge` (3 days, `pnpm-workspace.yaml`): Dependabot
# opens the PR, but it's `pnpm install` that resolves, and it will refuse a version published
# that same day. A PR can therefore stay red for a few days — this is the intended behavior,
# not a failure: the three-day window is precisely what catches a stolen maintainer
# token.

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────────
  # Prioritized, and not out of habit: an action runs with the job's secrets
  # (signing certificates, Vercel/Neon/Cloudflare tokens). `pnpm check:actions` already
  # requires a commit SHA — Dependakit therefore proposes a NEW SHA, never a moving tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # The Conventions' hard rule: English, `type(scope):`, no trace of a tool.
      prefix: "chore(ci)"

  # ── npm ───────────────────────────────────────────────────────────────────────
  # ONE entry for the whole monorepo: pnpm resolves from the ROOT lockfile, so an
  # entry per workspace would produce PRs stepping on each other over the same file.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Grouped, otherwise the noise drowns the signal: ~40 open advisories today, most
      # of them in the build tooling. One PR per group gets reviewed; forty
      # isolated PRs don't get reviewed, and that's how you stop looking.
      dev-tooling:
        patterns:
          - "@types/*"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "esbuild"
          - "tsup"
          - "tsx"
          - "typescript"
          - "turbo"
          - "electron-builder"
          - "@electron/*"
          - "@playwright/test"
          - "playwright*"
          - "jest"
          - "wrangler"
        update-types: [minor, patch]
      # Patches on a SHIPPED or SERVED surface arrive alone: these are the ones
      # `audit:gate` would flag, and a security patch doesn't get reviewed when drowned in
      # thirty tooling bumps.
      runtime-patches:
        patterns: ["*"]
        exclude-patterns:
          - "@types/*"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "esbuild"
          - "tsup"
          - "tsx"
          - "typescript"
          - "turbo"
          - "electron-builder"
          - "@electron/*"
          - "@playwright/test"
          - "playwright*"
          - "jest"
          - "wrangler"
        update-types: [patch]

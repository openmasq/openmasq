version: 2

# Mises à jour de dépendances proposées en PR. Le rôle est de rendre la dette VISIBLE
# et datée ; ce qui décide de bloquer ou non reste `scripts/audit-gate.mjs`, qui trie par
# SURFACE (livrée/servie vs outillage) plutôt que par sévérité brute.
#
# ⚠️ Ceci ne contourne PAS `minimumReleaseAge` (3 jours, `pnpm-workspace.yaml`) : Dependabot
# ouvre la PR, mais c'est `pnpm install` qui résout, et il refusera une version publiée le
# jour même. Une PR peut donc rester rouge quelques jours — c'est le comportement voulu,
# pas une panne : la fenêtre de trois jours est précisément ce qui rattrape un jeton de
# mainteneur volé.

updates:
  # ── Actions GitHub ────────────────────────────────────────────────────────────
  # Prioritaire, et pas par habitude : une action s'exécute avec les secrets du job
  # (certificats de signature, jetons Vercel/Neon/Cloudflare). `pnpm check:actions` impose
  # déjà un SHA de commit — Dependakit propose donc un NOUVEAU SHA, jamais un tag mouvant.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # La directive dure des Conventions : anglais, `type(scope):`, aucune trace d'outil.
      prefix: "chore(ci)"

  # ── npm ───────────────────────────────────────────────────────────────────────
  # UNE entrée pour tout le monorepo : pnpm résout depuis le lockfile RACINE, donc une
  # entrée par workspace produirait des PR qui se marchent dessus sur le même fichier.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Groupé, sinon le bruit noie le signal : ~40 avis ouverts aujourd'hui, dont la
      # grande majorité dans l'outillage de build. Une PR par groupe se relit ; quarante
      # PR isolées ne se relisent pas, et c'est ainsi qu'on cesse de regarder.
      dev-tooling:
        patterns:
          - "@types/*"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "esbuild"
          - "tsup"
          - "tsx"
          - "typescript"
          - "turbo"
          - "electron-builder"
          - "@electron/*"
          - "@playwright/test"
          - "playwright*"
          - "jest"
          - "wrangler"
        update-types: [minor, patch]
      # Les correctifs sur une surface LIVRÉE ou SERVIE arrivent seuls : ce sont ceux que
      # `audit:gate` retiendrait, et un correctif de sécurité ne se relit pas noyé dans
      # trente bumps d'outillage.
      runtime-patches:
        patterns: ["*"]
        exclude-patterns:
          - "@types/*"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "esbuild"
          - "tsup"
          - "tsx"
          - "typescript"
          - "turbo"
          - "electron-builder"
          - "@electron/*"
          - "@playwright/test"
          - "playwright*"
          - "jest"
          - "wrangler"
        update-types: [patch]

[package]
name = "openmasq-jail"
version = "0.1.0"
edition = "2021"
publish = false
description = "AppContainer + Job Object launcher — the Windows half of the run_python jail"

# `windows-sys` is Microsoft's OWN binding crate (raw FFI, no wrappers), pinned by
# Cargo.lock. It is the only dependency on purpose: this binary sits on a trust boundary,
# so its supply chain is one first-party crate and nothing else.
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

packages:
  - "apps/*"
  - "packages/*"
  # Vendored third-party packages (committed in full, referenced as workspace:*).
  - "vendor/*"

# Supply-chain cooldown: never RESOLVE a version published less than 3 days ago.
# A compromised-maintainer publish (the npm attack pattern: a stolen token pushes a
# malicious patch release, which lands in the next `pnpm install` anywhere) is almost
# always caught and unpublished within hours. Waiting costs us nothing — we don't need a
# dependency the day it ships — and it removes the window entirely.
#
# Only affects RESOLUTION: `--frozen-lockfile` (CI) is unaffected, and an urgent security
# patch can still be taken with `pnpm add <pkg>@<version> --config.minimumReleaseAge=0`.
minimumReleaseAge: 4320 # minutes = 3 days

# ⛔ AUCUN paquet n'exécute de script d'installation. pnpm 10 les bloque déjà par défaut ;
# la liste VIDE en fait une décision écrite plutôt qu'un effet de bord, parce que les deux
# noms qui s'y trouvaient ne tenaient ni l'un ni l'autre :
#
#  • `electron` y était « pour télécharger son binaire ». FAUX, et depuis longtemps : il n'a
#    plus AUCUN script (`scripts` absent de son package.json), il télécharge paresseusement
#    au premier `require`. La ligne n'autorisait donc rien du tout, pendant que son
#    commentaire faisait croire le contraire — c'est ce qui a gardé le trou invisible
#    jusqu'au 12/08 (`scripts/vitest.electron-stub.ts` raconte la panne). Le seul vrai filet
#    est l'étape « Ensure Electron binary » de `release.yml`, où l'app est réellement lancée.
#  • `esbuild` en a un, lui — et il est bloqué depuis toujours sans que rien n'en souffre
#    (ses binaires viennent des paquets optionnels par plateforme). L'autoriser rouvrirait un
#    accès réseau à l'install pour un besoin que rien ne démontre.
#
# ⚠️ La même clé vivait AUSSI dans `package.json`, et c'est celle-là que pnpm 10 lisait : elle
# masquait ce fichier, si bien qu'`esbuild` était ignoré alors qu'il est listé ici (visible
# dans « Ignored build scripts » de chaque install de CI). Un seul foyer désormais : ici.
onlyBuiltDependencies: []

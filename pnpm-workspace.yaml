packages:
  - "apps/*"
  - "packages/*"
  # Vendored third-party packages (committed in full, referenced as workspace:*).
  - "vendor/*"

# Supply-chain cooldown: never RESOLVE a version published less than 3 days ago.
# A compromised-maintainer publish (the npm attack pattern: a stolen token pushes a
# malicious patch release, which lands in the next `pnpm install` anywhere) is almost
# always caught and unpublished within hours. Waiting costs us nothing — we don't need a
# dependency the day it ships — and it removes the window entirely.
#
# Only affects RESOLUTION: `--frozen-lockfile` (CI) is unaffected, and an urgent security
# patch can still be taken with `pnpm add <pkg>@<version> --config.minimumReleaseAge=0`.
minimumReleaseAge: 4320 # minutes = 3 days

# ⛔ NO package runs an install script. pnpm 10 already blocks them by default;
# the EMPTY list makes it a written decision rather than a side effect, because the two
# names that used to be in it held up neither one:
#
#  • `electron` was there "to download its binary". FALSE, and for a long time: it no
#    longer has ANY script (`scripts` absent from its package.json), it lazily downloads
#    on the first `require`. The line therefore authorized nothing at all, while its
#    comment made you believe the opposite — that's what kept the hole invisible
#    until 12/08 (`scripts/vitest.electron-stub.ts` tells the story of the failure). The only real safety net
#    is `release.yml`'s "Ensure Electron binary" step, where the app is actually launched.
#  • `esbuild` does have one — and it has always been blocked with nothing suffering for it
#    (its binaries come from the per-platform optional packages). Allowing it would reopen
#    network access at install time for a need nothing demonstrates.
#
# ⚠️ The same key ALSO lived in `package.json`, and that's the one pnpm 10 was reading: it
# shadowed this file, so `esbuild` was ignored even though it's listed here (visible
# in every CI install's "Ignored build scripts"). Only one home now: here.
onlyBuiltDependencies: []

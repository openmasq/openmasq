# Secret-scanner allowlist. The PRODUCT is a redaction engine: its tests and
# fixtures necessarily contain secret-SHAPED strings (fake sk-live/AKIA/ghp_/JWT
# values such as `sk-live-DEADBEEF…`), and the local docker stack carries a
# shared, local-only hook constant. None of these is a live credential — a hit
# OUTSIDE these paths is a real finding and must be treated as one.

[extend]
useDefault = true

[[allowlists]]
description = "Fake secrets that exist on purpose (redaction fixtures, tests, local dev stack)"
paths = [
  '''apps/desktop/e2e/fixtures/pii/.*''',
  '''packages/redact/src/__fixtures__/.*''',
  '''.*\.test\.tsx?$''',
  # The redaction engine's regression corpus and external benchmark: annotated SYNTHETIC
  # PII by definition (that is what the engine is measured against). Every value here is
  # invented — a real one would be a fixture bug, caught by `check:pii`, not a leak. Scoped
  # to `bench/` so it also covers the corpus's earlier French filenames, still in history
  # (gitleaks reads every commit): a path allowlist keyed only on today's names would not
  # silence `categoriesMinces.json` / `categoriesRares.json`.
  '''packages/redact/bench/.*''',
  # The integrity FINGERPRINTS of the model weights — the exact opposite of a secret: they
  # exist so a substituted byte never reaches onnxruntime (rule 7). The content of these
  # two files is a table of URLs and sha256s, nothing else. Scoped to the FILE rather than
  # to a pattern: globally allowing "64 hex characters" would also muzzle a real 256-bit
  # key written in hex.
  '''apps/desktop/src/main/embed/model\.ts$''',
  '''packages/redact/src/local/ner\.ts$''',
]
# Allowed by the PREFIX that announces publishability, never by path: both keys are meant
# for a client and already travel in every binary. The prefix is what tells them apart from
# their secret twin, and the prefix is what we pin — an `sb_secret_…` or a
# `phx_…` (a personal PostHog API key) therefore still fires, wherever it sits.
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]{16,}''',
  '''phc_[A-Za-z0-9]{40,}''',
]

# The engine's OWN detection rule for AWS Bedrock's short-lived key: its literal head is
# the vendor prefix, so gitleaks' rule of the same name fires on the regex SOURCE. Scoped
# to that one rule AND to the match being followed by a character class `[` — a property
# of a regex literal that a real key, base64 to its end, never has. A Bedrock key pasted
# anywhere else in the tree still fires.
[[allowlists]]
description = "The redaction engine's Bedrock rule, written as a regex"
targetRules = ["aws-amazon-bedrock-api-key-short-lived"]
regexTarget = "line"
regexes = ['''bedrock-api-key-YmVkcm9jay5hbWF6b25hd3MuY29t\[''']

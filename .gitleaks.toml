# Secret-scanner allowlist. The PRODUCT is a redaction engine: its tests and
# fixtures necessarily contain secret-SHAPED strings (fake sk-live/AKIA/ghp_/JWT
# values such as `sk-live-DEADBEEF…`), and the local docker stack carries a
# shared, local-only hook constant. None of these is a live credential — a hit
# OUTSIDE these paths is a real finding and must be treated as one.

[extend]
useDefault = true

[allowlist]
description = "Fake secrets that exist on purpose (redaction fixtures, tests, local dev stack)"
paths = [
  '''apps/desktop/e2e/fixtures/pii/.*''',
  '''packages/redact/src/__fixtures__/.*''',
  '''.*\.test\.tsx?$''',
  '''apps/backend/docker-compose\.yml''',
  # Les EMPREINTES d'intégrité des poids de modèles — l'exact opposé d'un secret : elles
  # existent pour qu'un octet substitué n'atteigne jamais onnxruntime (règle 7). Le contenu
  # de ces deux fichiers est une table d'URL et de sha256, rien d'autre. Scopé au FICHIER
  # plutôt qu'à un motif : autoriser globalement « 64 caractères hexadécimaux » muselerait
  # aussi une vraie clé de 256 bits encodée en hex.
  '''apps/desktop/src/main/embed/model\.ts$''',
  '''packages/redact/src/local/ner\.ts$''',
]
# Autorisé par le PRÉFIXE qui annonce la publication, jamais par le chemin : ces deux clés
# sont destinées à un client et voyagent déjà dans chaque binaire. Le préfixe est ce qui les
# distingue de leur jumelle secrète, et c'est lui qu'on épingle — une `sb_secret_…` ou une
# `phx_…` (clé d'API personnelle PostHog) continue donc de déclencher, où qu'elle soit.
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]{16,}''',
  '''phc_[A-Za-z0-9]{40,}''',
]
